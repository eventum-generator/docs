name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Most existing files are not yet Prettier/ESLint clean, so formatting
      # and lint run only on the files this change touches.
      - name: List changed files
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          git diff --name-only --diff-filter=d "$BASE...HEAD" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Prettier (changed code files)
        run: |
          { grep -E '\.(c|m)?(j|t)sx?$|\.css$' "$RUNNER_TEMP/changed.txt" || true; } \
            | xargs -r -d '\n' pnpm exec prettier --check

      - name: ESLint (changed code files)
        run: |
          { grep -E '\.(c|m)?(j|t)sx?$' "$RUNNER_TEMP/changed.txt" || true; } \
            | xargs -r -d '\n' pnpm exec eslint --max-warnings 0 --no-warn-ignored

      - run: node scripts/check-hub-cards.mjs

      - run: pnpm types:check

      - run: pnpm build
